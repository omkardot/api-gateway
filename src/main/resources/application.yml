server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: movie-service
              uri: ${MOVIE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/movies/**

            # Later:
            # - id: user-service
            #   uri: ${USER_SERVICE_URL:http://localhost:8082}
            #   predicates:
            #     - Path=/api/users/**
            # - id: group-service
            #   uri: ${GROUP_SERVICE_URL:http://localhost:8083}
            #   predicates:
            #     - Path=/api/groups/**

management:
  endpoints:
    web:
      exposure:
        include: health,info